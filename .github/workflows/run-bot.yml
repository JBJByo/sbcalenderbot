name: Scheduled Discord Bot

on:
  schedule:
    # 요청하신 한국 시간(오전 6시, 오전 11시, 오후 3시, 오후 6시, 오후 8시, 오후 10시, 오후 11시)에 실행되도록 세팅한 시간표입니다.
    - cron: '0 2,6,9,11,13,14,21 * * *'
  workflow_dispatch: # 💡 언제든 내가 원할 때 버튼 눌러서 즉시 실행할 수 있게 해주는 보너스 기능

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run Bot
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      run: node index.js
